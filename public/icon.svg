<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- subtle coin glyph behind the monogram -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.14"/>
  <line x1="256" y1="118" x2="256" y2="394" stroke="#ffffff" stroke-width="20" opacity="0.10"/>
  <!-- KK monogram drawn as strokes (no font dependency) -->
  <g stroke="#ffffff" stroke-width="46" stroke-linecap="round" fill="none">
    <line x1="150" y1="160" x2="150" y2="352"/>
    <line x1="150" y1="262" x2="234" y2="160"/>
    <line x1="160" y1="250" x2="234" y2="352"/>
    <line x1="278" y1="160" x2="278" y2="352"/>
    <line x1="278" y1="262" x2="362" y2="160"/>
    <line x1="288" y1="250" x2="362" y2="352"/>
  </g>
</svg>
